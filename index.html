<!DOCTYPE html>
<html>
    <head>
        <title>Latihan Web</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <style>
        body {
            margin: 50px;
            background-color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        .kepala {
            background-color: white;
            padding: 100px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5 0 rgba(0, 0, 0, 0.5);
        }

        .menu {
            background-color: rgb(133, 188, 255);
            border-radius: 10px;
            box-shadow: 0 5 0 rgba(0, 0, 0, 0.5);
            padding: 10px;
            margin: 20px 0;
        }

        .menu ul li {
            display: inline;
            padding: 20px;
        }

        .menu a {
            color: white;
            font-weight: 500;
            text-decoration: none;
        }

        .menu a:hover {
            color: rgb(0, 90, 234);
        }

        .samping {
            float: left;
            width: 300px;
            background-color: white;
            box-shadow: 0 5 0 rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px;
        }

        .samping .profil {
            width: 200px;
            border: 1px solid rgb(133, 188, 255);
        }

        .samping h3 {
            text-align: center;
            border-bottom: 2px solid rgb(133, 188, 255);
            padding: 10px;
        }

        .tengah {
            height: 600px;
            background-color: white;
            padding: 10px 20px;
            margin-left: 330px;
            border-radius: 10px;
            box-shadow: 0 5 0 rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .kaki {
            background-color: rgb(133, 188, 255);
            padding: 2px;
            margin: 10px 0;
            border-radius: 10px;
            color: white;
            box-shadow: 0 5 10 rgba(0, 0, 0, 0.5);
        }

        .kaki h3 {
            padding: 0px 10px;
        }
    </style>
    <body>
        <div class="kepala">
            <h1>Header</h1>
        </div>

        <div class="menu">
            <ul>
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Profil</a></li>
                <li><a href="#">Artikel</a></li>
                <li><a href="#">Porto</a></li>
                <li><a href="#">Kontak</a></li>
            </ul>
        </div>

        <div class="samping">
            <h3>Tentang Penulis</h3>
            <img src="foto.JPG" class="profil">
            <p>Halo saya Adnan, orang yang suka mencari tahu hal-hal baru seputar teknologi, informasi dan komunikasi.</p>
        </div>

        <div class="tengah">
            <h3>Konten</h3>
        </div>

        <div class="kaki">
            <h3>Footer</h3>
        </div>
    </body>
</html>
